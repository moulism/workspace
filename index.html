<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Workspace</title>
  <meta name="theme-color" content="#4f46e5" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    // Apply theme before paint to avoid a flash of the wrong theme.
    (function () {
      try {
        var t = localStorage.getItem("pw-theme") || "system";
        if (t === "light") document.documentElement.setAttribute("data-theme", "light");
        if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="auth-root"></div>

  <div id="app" class="hidden">
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="logo">W</span>
        <span>Workspace</span>
      </div>

      <div class="nav-group">
        <a class="nav-item" data-route="dashboard"><span class="ic">🏠</span>Přehled</a>
      </div>

      <div class="nav-group">
        <div class="nav-group-label">Organizace</div>
        <a class="nav-item" data-route="notes"><span class="ic">📝</span>Poznámky</a>
        <a class="nav-item" data-route="calendar"><span class="ic">📅</span>Kalendář</a>
        <a class="nav-item" data-route="todos"><span class="ic">✅</span>Úkoly</a>
        <a class="nav-item" data-route="goals"><span class="ic">🎯</span>Cíle</a>
        <a class="nav-item" data-route="diary"><span class="ic">📔</span>Deník</a>
      </div>

      <div class="nav-group">
        <div class="nav-group-label">Zdraví</div>
        <a class="nav-item" data-route="gym"><span class="ic">🏋️</span>Gym</a>
        <a class="nav-item" data-route="meals"><span class="ic">🍽️</span>Jídelníček</a>
        <a class="nav-item" data-route="recipes"><span class="ic">📖</span>Recepty</a>
        <a class="nav-item" data-route="shopping"><span class="ic">🛒</span>Nákupy</a>
      </div>

      <div class="sidebar-footer">
        <a class="nav-item" data-route="settings"><span class="ic">⚙️</span>Nastavení</a>
        <div class="user-chip">
          <span class="avatar" id="user-avatar">?</span>
          <span class="truncate" id="user-email">…</span>
        </div>
        <button class="btn btn-ghost btn-sm" id="signout-btn">Odhlásit se</button>
      </div>
    </nav>

    <div class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:10px;">
          <button class="btn btn-icon menu-btn" id="menu-btn">☰</button>
          <h1 id="view-title">Přehled</h1>
        </div>
        <div class="topbar-right">
          <button class="btn btn-icon" id="theme-btn" title="Přepnout motiv">🌓</button>
        </div>
      </div>
      <div class="view" id="view-container"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
